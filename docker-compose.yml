services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: mfolio-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Full-Stack Next.js Application Container (Dev mode with Live Hot-Reloading)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mfolio-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mfolio?schema=public
      - JWT_SECRET=mfolio-super-secret-jwt-key-2026-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"

volumes:
  postgres_data:
